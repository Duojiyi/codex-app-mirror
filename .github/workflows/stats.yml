name: Update Download Stats

# Maintains a cumulative installer-download counter in R2 and writes a
# shields.io endpoint badge (stats/downloads.json). R2 analytics only retains
# ~32 days, so the running total is accumulated daily from fully-elapsed days.

on:
  workflow_dispatch:
  schedule:
    - cron: "37 2 * * *" # daily at 02:37 UTC

permissions:
  contents: read

concurrency:
  group: codex-app-mirror-stats
  cancel-in-progress: false

env:
  R2_BUCKET_NAME: codex-app-mirror

jobs:
  stats:
    name: Update cumulative download badge
    # Scope Cloudflare/R2 credentials to this job instead of every workflow in
    # the repository. The environment is restricted to the main branch.
    environment: download-stats
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate download stats configuration
        shell: bash
        env:
          CF_ANALYTICS_API_TOKEN: ${{ secrets.CF_ANALYTICS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail

          missing=()
          for name in \
            CF_ANALYTICS_API_TOKEN \
            CLOUDFLARE_ACCOUNT_ID \
            R2_ACCESS_KEY_ID \
            R2_SECRET_ACCESS_KEY
          do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} )); then
            printf -v missing_list '%s, ' "${missing[@]}"
            missing_list="${missing_list%, }"
            echo "::error title=Missing download stats configuration::Configure the download-stats environment. Missing: ${missing_list}. See docs/download-stats.md."
            exit 1
          fi

      - name: Checkout agents-mirror-kit
        # Pin third-party actions to an immutable commit (actions/checkout v6).
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: Wangnov/agents-mirror-kit
          ref: v0.2.0
          path: .mirror-kit
          persist-credentials: false

      - name: Verify AWS CLI
        shell: bash
        run: aws --version

      - name: Update stats and badge
        env:
          CF_ANALYTICS_API_TOKEN: ${{ secrets.CF_ANALYTICS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          STATS_OBJECTS: latest/win,latest/win-x64,latest/win-arm64,latest/mac-intel,latest/mac-arm64
        run: python3 .mirror-kit/scripts/update-download-stats.py
